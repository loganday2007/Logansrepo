<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview - Logan Day Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --yellow: #f8e21a;
        --black: #0b0b0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Black Ops One", "Arial Black", sans-serif;
        color: var(--black);
        background: var(--yellow);
        min-height: 100vh;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 4vw, 56px);
        letter-spacing: 0.5px;
      }

      .subtitle {
        margin: 0 0 32px;
        font-size: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(160px, 220px) 1fr;
        gap: 24px;
        align-items: start;
      }

      .tabs {
        position: sticky;
        top: 32px;
        display: grid;
        gap: 10px;
      }

      .tab {
        border: 2px solid var(--black);
        border-radius: 999px;
        padding: 10px 14px;
        background: rgba(11, 11, 11, 0.05);
        color: var(--black);
        text-align: left;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        letter-spacing: 0.4px;
      }

      .tab.active {
        background: var(--black);
        color: var(--yellow);
      }

      .gallery {
        column-count: 3;
        column-gap: 12px;
      }

      .card {
        break-inside: avoid;
        margin-bottom: 12px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid var(--black);
        background: #fdf07a;
      }

      .card img {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .tabs {
          position: static;
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }

        .gallery {
          column-count: 2;
        }
      }

      @media (max-width: 560px) {
        .gallery {
          column-count: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Logan Day Portfolio</h1>
      <p class="subtitle">Website: Logandayphotography.com Email: Loganday2007@icloud.com</p>

      <div class="layout">
        <nav class="tabs">
          <div class="tab active">All Sections <span>92</span></div>
          <div class="tab">Basketball <span>31</span></div>
          <div class="tab">Football <span>28</span></div>
          <div class="tab">Senior Portraits <span>24</span></div>
          <div class="tab">Couples Session <span>14</span></div>
        </nav>

        <div class="gallery">
          <div class="card">
            <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=900&q=60" alt="" />
          </div>
          <div class="card">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=60" alt="" />
          </div>
          <div class="card">
            <img src="https://images.unsplash.com/photo-1471879832106-c7ab9e0cee23?auto=format&fit=crop&w=900&q=60" alt="" />
          </div>
          <div class="card">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=900&q=60" alt="" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
